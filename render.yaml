# Triển khai một chạm lên Render.com (HTTPS miễn phí): New > Blueprint > chọn repo này.
services:
  - type: web
    name: tro-ly-sang-mat
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_ACCESS_CODE
        sync: false
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
      - key: ENABLE_WEB_SEARCH
        value: "true"
